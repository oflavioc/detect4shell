# Detect4Shell on-the-wire — stack ModSecurity: WAF (OWASP ModSecurity/nginx) -> backend inerte.
# O WAF da Include nas regras ENVIADAS (regras/modsecurity/detect4shell.conf, montadas read-only)
# + no overlay de enforcement, e faz proxy do trafego permitido para o backend.
name: detect4shell-on-the-wire-modsec
services:
  backend:
    image: nginx:1.27-alpine
    volumes:
      - ./backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [wire]

  waf:
    build:
      context: .
      dockerfile: Dockerfile.waf
    depends_on: [backend]
    environment:
      BACKEND: "http://backend:80"
      PORT: "8080"
      SERVER_NAME: "localhost"
      MODSEC_RULE_ENGINE: "On"          # On => a acao `deny` do overlay realmente bloqueia (403)
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG: "/dev/stdout"   # audit JSON vai pro stdout -> `docker compose logs waf`
      MODSEC_AUDIT_LOG_FORMAT: "JSON"
    ports:
      - "127.0.0.1:18088:8080"          # local-only
    volumes:
      # arquivo de regras ENVIADO, montado como-esta (testamos exatamente o que o repo entrega)
      - ../../../regras/modsecurity/detect4shell.conf:/rules/detect4shell.conf:ro
      - ./overlay.conf:/rules/overlay.conf:ro
    networks: [wire]

networks:
  wire: {}
