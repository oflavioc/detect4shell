# Backend inerte: app fake atras do WAF. Responde 200 em QUALQUER rota. Se um request chega
# aqui, o WAF o deixou passar; se e bloqueado, o WAF devolve 403 e o backend nunca e tocado.
server {
  listen 80;
  server_name _;
  location / {
    add_header Content-Type text/plain;
    return 200 "detect4shell-backend-ok\n";
  }
}
