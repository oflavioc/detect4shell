events {}
http {
    # Detect4Shell — edge nginx (padroes canonicos do repo: regras/nginx/detect4shell.conf;
    # sincronia com o canonico garantida pelo CI via testes/canonical_sync.py).
    # Reverse-proxy que BLOQUEIA a forma do gatilho Java4Shell (CVE-2026-114938) ANTES do backend Java.
    log_format j4s '$remote_addr [$time_local] "$request" -> status=$status '
                   'j4s_auth=$j4s_auth j4s_args=$j4s_args j4s_cookie=$j4s_cookie ua="$http_user_agent"';

    map $http_authorization $j4s_auth {
        default 0;
        "~(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}+|(?:[A-Za-z0-9_-]{4}){16,}+)={1,2}(?![A-Za-z0-9+/_=-])" 1;
    }
    map $args $j4s_args {
        default 0;
        "~(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}+|(?:[A-Za-z0-9_-]{4}){16,}+)(?:={1,2}(?![A-Za-z0-9+/_=-])|%3[dD])" 1;
    }
    map $http_cookie $j4s_cookie {
        default 0;
        "~(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}+|(?:[A-Za-z0-9_-]{4}){16,}+)={1,2}(?![A-Za-z0-9+/_=-])" 1;
    }

    server {
        listen 80;
        server_name _;
        access_log /var/log/nginx/j4s.log j4s;

        location / {
            set $j4s_hit "${j4s_auth}${j4s_args}${j4s_cookie}";
            if ($j4s_hit != "000") {
                return 403 "Detect4Shell: Java4Shell trigger-shape bloqueado na borda (CVE-2026-114938)\n";
            }
            # host.docker.internal = host onde roda o VulnBasicAuthServer (:18080)
            proxy_pass http://host.docker.internal:18080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
