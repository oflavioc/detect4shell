# Detect4Shell — nginx: DETECTAR e PREVENIR o Java4Shell (CVE-2026-114938) na borda.
# nginx usa PCRE (suporta lookbehind), então usamos a forma precisa das regras.
#
# Como usar:
#   1) coloque os blocos `map` abaixo no contexto http { } (fora de server { }).
#   2) dentro do server { } (ou location da sua app Java exposta), use os `if ... return 403`.
#   3) comece em modo LOG (comente os `return 403;`) por alguns dias; depois ligue o bloqueio.
#
# Um token Base64 malformado nunca é exigido por um cliente correto, então bloquear é seguro —
# mas valide primeiro fluxos de auth/SAML/JWT no seu tráfego real.
#
# COBERTURA (honestidade): estes `map` inspecionam só $http_authorization (header), $args (query-string)
# e $http_cookie (cookie) — NÃO quebram SEGMENTOS DE PATH da URL. Um sink que Base64-decoda um segmento de
# caminho (ex.: /download/<b64>=, id REST codificado) NÃO é pego aqui, porque '/' pertence ao alfabeto
# Base64 e a regex de linha única não casaria a URI inteira colada no separador. Esse controle de
# path-segment é o Servlet Filter em mitigacao/Java4ShellFilter.java (pathTrigger/segmentHit, que segmenta
# o caminho por '/'). Para cobrir paths também na borda nginx, segmente $uri por '/' no seu próprio bloco.

# ---- coloque em: http { } ----
map $http_authorization $j4s_auth {
    default 0;
    "~(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}+|(?:[A-Za-z0-9_-]{4}){16,}+)={1,2}(?![A-Za-z0-9+/_=-])" 1;
}
map $args $j4s_args {
    default 0;
    # trata o '=' literal e o percent-encoded (%3D) em parâmetros (ex.: SAMLResponse)
    "~(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}+|(?:[A-Za-z0-9_-]{4}){16,}+)(?:={1,2}(?![A-Za-z0-9+/_=-])|%3[dD])" 1;
}
map $http_cookie $j4s_cookie {
    default 0;
    "~(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}+|(?:[A-Za-z0-9_-]{4}){16,}+)={1,2}(?![A-Za-z0-9+/_=-])" 1;
}

# ---- coloque em: server { } (ou no location da app Java) ----
#   # DETECÇÃO (sempre): registra em log quando bater
#   set $j4s_hit "${j4s_auth}${j4s_args}${j4s_cookie}";
#   if ($j4s_hit != "000") {
#       access_log /var/log/nginx/java4shell.log combined;
#   }
#
#   # PREVENÇÃO (ligar após ajustar): bloqueia a requisição
#   if ($j4s_auth)   { return 403; }
#   if ($j4s_args)   { return 403; }
#   if ($j4s_cookie) { return 403; }
