# Detect4Shell — regras ModSecurity para o Java4Shell (CVE-2026-114938), só defensivo.
# Casa a FORMA do gatilho Base64-malformado em headers, args, cookies e corpo, nos dois
# alfabetos. Fecha as lacunas do upstream: só-Basic-auth + exata-"A" + só-alfabeto-padrão
# + sem SAML. sids 2026114950-957.
#
# MODO: entregue em forma DETECTONLY (pass,log) por padrão, pois a FORMA do gatilho pode,
# raramente, aparecer em tokens malformados legítimos. Troque `pass` -> `deny` (e descomente
# status:403) só após ajustar ao seu tráfego. Um token Base64 malformado nunca é exigido por
# um cliente correto, então bloquear costuma ser seguro — mas valide primeiro em fluxos
# de auth/SAML/JWT.

SecComponentSignature "java4shell-improved/1.0"

# Rule 1: malformed Base64 trigger shape in Authorization header (Basic OR Bearer, any bytes)
SecRule REQUEST_HEADERS:Authorization "@rx (?<![A-Za-z0-9+/_-])(?:[A-Za-z0-9+/_-]{4}){16,}=(?:[^A-Za-z0-9+/_=-]|$)" \
    "id:2026114950,phase:1,pass,log,\
    msg:'Java4Shell: malformed Base64 trigger shape in Authorization (CVE-2026-114938)',\
    tag:'cve/CVE-2026-114938',tag:'attack/dos-heap-overflow',severity:'WARNING',\
    logdata:'matched trigger-shape in Authorization'"

# Rule 2: malformed Base64 trigger shape in ANY other request header
SecRule REQUEST_HEADERS "@rx (?<![A-Za-z0-9+/_-])(?:[A-Za-z0-9+/_-]{4}){16,}=(?:[^A-Za-z0-9+/_=-]|$)" \
    "id:2026114951,phase:1,pass,log,\
    msg:'Java4Shell: malformed Base64 trigger shape in a request header (CVE-2026-114938)',\
    tag:'cve/CVE-2026-114938',severity:'WARNING'"

# Rule 3: malformed Base64 trigger shape in query args or body args (covers SAML*, params)
SecRule ARGS "@rx (?<![A-Za-z0-9+/_-])(?:[A-Za-z0-9+/_-]{4}){16,}=(?:[^A-Za-z0-9+/_=-]|$)" \
    "id:2026114952,phase:2,pass,log,\
    msg:'Java4Shell: malformed Base64 trigger shape in an argument (CVE-2026-114938)',\
    tag:'cve/CVE-2026-114938',severity:'WARNING'"

# Rule 4: SAML parameter carrying a long malformed base64 tail (high confidence; IdP pre-auth sink)
SecRule ARGS_NAMES "@rx ^SAML(Request|Response)$" \
    "id:2026114953,phase:2,pass,log,chain,\
    msg:'Java4Shell: malformed Base64 in SAML parameter (CVE-2026-114938)',\
    tag:'cve/CVE-2026-114938',severity:'CRITICAL'"
    SecRule ARGS "@rx (?:[A-Za-z0-9+/%_-]{4}){16,}(?:=|%3[dD])" "t:none"

# Rule 5: malformed Base64 trigger shape in a Cookie value
SecRule REQUEST_COOKIES "@rx (?<![A-Za-z0-9+/_-])(?:[A-Za-z0-9+/_-]{4}){16,}=(?:[^A-Za-z0-9+/_=-]|$)" \
    "id:2026114954,phase:1,pass,log,\
    msg:'Java4Shell: malformed Base64 trigger shape in a cookie (CVE-2026-114938)',\
    tag:'cve/CVE-2026-114938',severity:'WARNING'"

# Rule 6: JIT warm-up burst — high-rate Basic auth from one IP (corroborating signal)
# init the per-IP collection FIRST (required, or the ip.* counter never persists across requests)
SecAction "id:2026114957,phase:1,pass,nolog,initcol:ip=%{REMOTE_ADDR}"
SecRule REQUEST_HEADERS:Authorization "@beginsWith Basic " \
    "id:2026114955,phase:1,pass,nolog,\
    setvar:'ip.j4s_warm=+1',expirevar:'ip.j4s_warm=60'"
SecRule IP:J4S_WARM "@gt 2000" \
    "id:2026114956,phase:1,pass,log,\
    msg:'Java4Shell: potential JIT warm-up burst (CVE-2026-114938)',\
    tag:'cve/CVE-2026-114938',severity:'NOTICE'"
