# Detect4Shell — regras Sigma para o Java4Shell (CVE-2026-114938), só detecção defensiva.
# Generalizado além de Basic-auth / exata-de-"A" para a FORMA do gatilho Base64-malformado
# em sinks de decodificação pré-auth + os dois alfabetos, mais sinais de pós-exploração
# no host (crash). As regras de rede assumem um log de proxy/webserver que captura os
# campos header + uri + corpo.
#
# PORTABILIDADE: os campos `cs-Authorization` / `cs-body` / `cs-Cookie` / `cs-uri-query` NÃO são
# taxonomia Sigma padrão — ajuste para o mapeamento do seu backend (ex.: um pipeline pySigma). Estas
# regras são mais ilustrativas que drop-in. A regra de "exceções repetidas" casa a substring
# `IllegalArgumentException`, que pode ser ruidosa — correlacione com `java.util.Base64$Decoder`.
# ATENÇÃO (backend sem lookbehind): os padrões `|re` abaixo usam lookbehind `(?<!...)`, que compila em
# PCRE (Splunk/QRadar) mas NÃO em Elastic/Lucene nem KQL (RE2). Para esses, use a variante de fronteira
# RE2: `(^|[^A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}|(?:[A-Za-z0-9_-]{4}){16,})={1,2}([^A-Za-z0-9+/_=-]|$)`.
---
title: Java4Shell - Malformed Base64 trigger shape in HTTP request (network)
id: 9f2a7c10-1d44-4b8e-9a01-java4shell-net1
status: experimental
description: >
    Detects the CVE-2026-114938 trigger shape - a base64 run of >=64 chars (standard
    or url-safe alphabet) followed by one or two '=' (A*64+'=' and '==' both fire) - in any
    request header, URI/query, body or cookie. Covers SAML/Bearer/cookie/param sinks the
    Basic-auth-only rules miss. SHAPE match: treat single hits as low/medium, escalate on
    warm-up or crash correlation.
logsource:
    category: proxy
detection:
    malformed_tail:
        - cs-uri-query|re: '(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}|(?:[A-Za-z0-9_-]{4}){16,})={1,2}(?:[^A-Za-z0-9+/_=-]|$)'
        - cs-Authorization|re: '(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}|(?:[A-Za-z0-9_-]{4}){16,})={1,2}(?:[^A-Za-z0-9+/_=-]|$)'
        - cs-Cookie|re: '(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}|(?:[A-Za-z0-9_-]{4}){16,})={1,2}(?:[^A-Za-z0-9+/_=-]|$)'
        - cs-body|re: '(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}|(?:[A-Za-z0-9_-]{4}){16,})={1,2}(?:[^A-Za-z0-9+/_=-]|$)'
    condition: malformed_tail
level: medium
tags: [attack.initial_access, attack.t1190, cve.2026.114938]
---
title: Java4Shell - SAML parameter with malformed Base64 (high confidence)
id: 9f2a7c10-1d44-4b8e-9a01-java4shell-saml
status: experimental
description: SAMLRequest/SAMLResponse carrying a malformed base64 tail - IdP/SSO pre-auth decode sink (Keycloak/PingFederate).
logsource:
    category: proxy
detection:
    saml_param:
        - cs-uri-query|contains: ['SAMLRequest=', 'SAMLResponse=']
        - cs-body|contains: ['SAMLRequest=', 'SAMLResponse=']
    malformed_tail:
        - cs-uri-query|re: '(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}|(?:[A-Za-z0-9_-]{4}){16,})(?:={1,2}(?![A-Za-z0-9+/_=-])|%3[dD])'
        - cs-body|re: '(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}|(?:[A-Za-z0-9_-]{4}){16,})(?:={1,2}(?![A-Za-z0-9+/_=-])|%3[dD])'
    condition: saml_param and malformed_tail
level: high
tags: [attack.initial_access, attack.t1190, cve.2026.114938]
---
title: Java4Shell - Repeated Base64 decode exceptions (host, application log)
id: 9f2a7c10-1d44-4b8e-9a01-java4shell-exc
status: experimental
description: >
    Each trigger attempt throws IllegalArgumentException from java.util.Base64$Decoder
    *after* the out-of-bounds write. A burst is a strong on-host signal.
logsource:
    category: application
    product: java
detection:
    selection:
        Message|contains:
            - 'java.util.Base64'
            - 'Input byte array has wrong 4-byte ending unit'
            - 'IllegalArgumentException'
    timeframe: 5m
    condition: selection | count() > 10
level: high
tags: [attack.execution, cve.2026.114938]
---
title: Java4Shell - JVM fatal crash in Base64/GC stub (host, post-exploitation/DoS)
id: 9f2a7c10-1d44-4b8e-9a01-java4shell-crash
status: experimental
description: hs_err / SIGSEGV naming StubRoutines or G1 GC - heap corruption from the overflow (crash = demonstrated impact).
logsource:
    category: file_event
    product: linux
detection:
    hs_err:
        TargetFilename|contains: 'hs_err_pid'
    crash_frame:
        Message|contains: ['StubRoutines', 'G1ParScanThreadState', '_base64_decodeBlock', 'SIGSEGV']
    condition: hs_err or crash_frame
level: critical
tags: [attack.impact, cve.2026.114938]
