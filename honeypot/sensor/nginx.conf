# Detect4Shell honeypot SENSOR — MONITOR MODE (detect-only, never blocks).
# Maps copied from regras/nginx/detect4shell.conf (canonical split + ={1,2} form).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
    client_body_temp_path /tmp/cb;
    proxy_temp_path       /tmp/pt;
    fastcgi_temp_path     /tmp/fc;
    uwsgi_temp_path       /tmp/uw;
    scgi_temp_path        /tmp/sc;

    server_tokens off;
    client_max_body_size 8k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;

    map $http_authorization $j4s_auth {
        default 0;
        "~(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}+|(?:[A-Za-z0-9_-]{4}){16,}+)={1,2}(?![A-Za-z0-9+/_=-])" 1;
    }
    map $args $j4s_args {
        default 0;
        "~(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}+|(?:[A-Za-z0-9_-]{4}){16,}+)(?:={1,2}(?![A-Za-z0-9+/_=-])|%3[dD])" 1;
    }
    map $http_cookie $j4s_cookie {
        default 0;
        "~(?<![A-Za-z0-9+/_-])(?:(?:[A-Za-z0-9+/]{4}){16,}+|(?:[A-Za-z0-9_-]{4}){16,}+)={1,2}(?![A-Za-z0-9+/_=-])" 1;
    }
    # "000" = no hit
    map "${j4s_auth}${j4s_args}${j4s_cookie}" $j4s_hit {
        "000"   0;
        default 1;
    }

    # Structured alert. Raw CREDENTIAL-bearing values (Authorization/args/cookie) are deliberately NOT
    # logged — only the match flags + an Authorization length BUCKET. Routine request metadata IS logged
    # (ts, src IP, method, $uri path without query-string, and the client-controlled User-Agent).
    log_format j4s_json escape=json
      '{"ts":"$time_iso8601","src":"$remote_addr","method":"$request_method",'
      '"uri_path":"$uri","ua":"$http_user_agent",'
      '"j4s_match":{"authorization":$j4s_auth,"args":$j4s_args,"cookie":$j4s_cookie},'
      '"authz_len":"$http_authorization_len","mode":"monitor","action":"logged_and_proxied"}';

    # (length of Authorization header, computed without logging its value)
    map $http_authorization $http_authorization_len {
        default "0";
        "~^.{1,63}$" "<64";
        "~^.{64,255}$" "64-255";
        "~^.{256,}$" ">=256";
    }

    access_log off;

    server {
        listen 8080;
        # MONITOR: log only on hit, to file + stdout; NEVER return 403.
        access_log /var/log/j4s/alerts.jsonl j4s_json if=$j4s_hit;
        access_log /dev/stdout j4s_json if=$j4s_hit;

        location / {
            proxy_pass http://mock:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
    }
}
