# INERT mock backend: fixed response, no parsing, no decoding, not Java.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    client_body_temp_path /tmp/cb;
    proxy_temp_path /tmp/pt; fastcgi_temp_path /tmp/fc; uwsgi_temp_path /tmp/uw; scgi_temp_path /tmp/sc;
    server_tokens off;
    client_max_body_size 8k;
    access_log off;
    server {
        listen 8080;
        default_type text/plain;
        location / { return 200 "OK\n"; }
    }
}
